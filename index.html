<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>数析学院 - 完整学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0A0A0A;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        /* 导航栏 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: #1A1A1A;
            border-radius: 12px;
            margin-bottom: 32px;
            border: 1px solid #2A2A2A;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #3B82F6;
        }
        .nav-links {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .nav-links button {
            background: none;
            border: none;
            color: #E0E0E0;
            cursor: pointer;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .nav-links button:hover {
            background: #2A2A2A;
            color: #FFFFFF;
        }
        .nav-links button.active {
            background: #3B82F6;
            color: white;
        }
        .login-btn {
            background: #3B82F6;
            padding: 8px 28px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 500;
        }
        .login-btn:hover {
            background: #2563EB;
        }
        .page-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }
        .page-title h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #FFFFFF;
        }
        .page-title p {
            color: #A0A0A0;
            font-size: 16px;
        }
        /* 卡片网格 */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
        }
        /* 课程卡片 */
        .course-card {
            background: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 16px;
            padding: 24px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .course-card:hover {
            border-color: #3B82F6;
            transform: translateY(-2px);
        }
        .course-emoji {
            font-size: 42px;
            margin-bottom: 16px;
        }
        .course-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #FFFFFF;
        }
        .course-desc {
            color: #A0A0A0;
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .course-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .difficulty {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .difficulty.beginner { background: #10B981; color: white; }
        .difficulty.intermediate { background: #F59E0B; color: white; }
        .difficulty.advanced { background: #EF4444; color: white; }
        .progress-text {
            color: #3B82F6;
            font-size: 13px;
            font-weight: 500;
        }
        .progress-bar {
            height: 6px;
            background: #2A2A2A;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 0;
        }
        .progress-fill {
            height: 100%;
            background: #3B82F6;
            width: 0%;
            transition: width 0.3s;
        }
        /* 小节列表项 */
        .lesson-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #0D0D0D;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .lesson-item:hover {
            background: #151515;
            border-color: #3B82F6;
        }
        .lesson-item.completed {
            border-left: 3px solid #10B981;
        }
        .lesson-info {
            flex: 1;
        }
        .lesson-name {
            font-size: 15px;
            color: #E0E0E0;
            margin-bottom: 4px;
        }
        .lesson-duration {
            color: #6B7280;
            font-size: 12px;
        }
        .lesson-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .lesson-badge {
            font-size: 18px;
        }
        .complete-btn {
            background: #10B981;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }
        .complete-btn:hover {
            background: #059669;
        }
        .complete-btn.done {
            background: #2A2A2A;
            color: #6B7280;
            cursor: default;
        }
        /* 提示框 */
        .tip-box {
            background: #0D2A1A;
            border-left: 4px solid #10B981;
            padding: 14px 16px;
            margin: 18px 0;
            border-radius: 8px;
        }
        .tip-box strong {
            color: #10B981;
        }
        /* 错误提示框 */
        .error-box {
            background: #2A0D0D;
            border-left: 4px solid #EF4444;
            padding: 14px 16px;
            margin: 18px 0;
            border-radius: 8px;
        }
        .error-box strong {
            color: #EF4444;
        }
        /* 练习区 */
        .practice-area {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #2A2A2A;
        }
        .practice-area h5 {
            color: #3B82F6;
            margin-bottom: 14px;
            font-size: 18px;
        }
        .practice-area textarea {
            width: 100%;
            background: #0D0D0D;
            color: #E0E0E0;
            font-family: 'Courier New', 'Fira Code', monospace;
            padding: 14px;
            border: 1px solid #2A2A2A;
            border-radius: 10px;
            font-size: 13px;
            resize: vertical;
        }
        .practice-area textarea:focus {
            outline: none;
            border-color: #3B82F6;
        }
        .run-btn {
            background: #3B82F6;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
        }
        .run-btn:hover {
            background: #2563EB;
        }
        .practice-output {
            background: #0D0D0D;
            border: 1px solid #2A2A2A;
            border-radius: 10px;
            padding: 14px;
            margin-top: 14px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            color: #10B981;
        }
        /* 数据集卡片 */
        .dataset-card {
            background: #0D0D0D;
            border-radius: 10px;
            padding: 14px;
            margin-top: 16px;
        }
        .download-btn {
            background: #3B82F6;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
            display: inline-block;
            font-weight: 500;
        }
        .download-btn:hover {
            background: #2563EB;
        }
        .hidden {
            display: none;
        }
        /* 详情页面通用 */
        .detail-page {
            display: block;
        }
        .back-btn {
            background: #2A2A2A;
            color: #E0E0E0;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .back-btn:hover {
            background: #3B82F6;
            color: white;
        }
        .course-detail-header {
            background: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 24px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .course-icon {
            font-size: 48px;
        }
        .lessons-list-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .lessons-sidebar {
            flex: 0 0 350px;
            background: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 16px;
            padding: 20px;
            max-height: calc(100vh - 250px);
            overflow-y: auto;
        }
        .lessons-sidebar h3 {
            margin-bottom: 16px;
            color: #FFFFFF;
        }
        .lesson-detail-panel {
            flex: 1;
            min-width: 400px;
            background: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 16px;
            padding: 28px;
        }
        .lesson-detail-panel h2 {
            margin-bottom: 8px;
            color: #FFFFFF;
        }
        .lesson-meta {
            color: #6B7280;
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .lesson-detail-panel pre {
            background: #0D0D0D;
            padding: 16px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 18px 0;
            font-family: 'Courier New', 'Fira Code', monospace;
            font-size: 13px;
            border: 1px solid #2A2A2A;
            color: #10B981;
        }
        /* 代码高亮 */
        .code-keyword { color: #FF79C6; }
        .code-string { color: #F1FA8C; }
        .code-comment { color: #6272A4; }
        .code-number { color: #BD93F9; }
        /* 响应式 */
        @media (max-width: 900px) {
            .lessons-list-container { flex-direction: column; }
            .lessons-sidebar { flex: none; max-height: 300px; }
            .lesson-detail-panel { min-width: 100%; }
        }
        @media (max-width: 700px) {
            .courses-grid { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">📊 数析学院</div>
    <div class="nav-links">
        <button class="nav-btn active" data-page="courses">课程中心</button>
        <button class="nav-btn" data-page="projects">实战项目</button>
        <button class="nav-btn" data-page="achievements">成就殿堂</button>
    </div>
    <button class="login-btn">登录</button>
</div>

<div class="page-container">
    <!-- 课程列表页 -->
    <div id="coursesListPage">
        <div class="page-title">
            <h1>📚 课程中心</h1>
            <p>点击课程卡片开始学习</p>
        </div>
        <div class="courses-grid" id="coursesGrid"></div>
    </div>

    <!-- 课程详情页（小节列表） -->
    <div id="courseDetailPage" class="detail-page hidden">
        <button class="back-btn" onclick="showCoursesList()">← 返回课程中心</button>
        <div class="course-detail-header" id="courseDetailHeader"></div>
        <div class="lessons-list-container">
            <div class="lessons-sidebar" id="lessonsListSidebar"></div>
            <div class="lesson-detail-panel">
                <div style="text-align: center; color: #6B7280; padding: 60px 20px;">
                    <p style="font-size: 40px; margin-bottom: 20px;">📖</p>
                    <p style="font-size: 18px;">请点击左侧小节查看详细内容</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 小节详情页（独立页面） -->
    <div id="lessonDetailPage" class="detail-page hidden">
        <div style="margin-bottom: 20px; display: flex; gap: 12px;">
            <button class="back-btn" onclick="showCourseDetail(currentCourseId)">← 返回课程</button>
            <button class="back-btn" onclick="showCoursesList()">← 返回课程中心</button>
        </div>
        <div class="course-detail-header" id="lessonDetailHeader"></div>
        <div id="lessonDetailContent"></div>
    </div>

    <!-- 实战项目 -->
    <div id="projectsPage" class="hidden">
        <div class="page-title">
            <h1>💻 实战项目</h1>
            <p>下载数据集，开始你的数据分析实战</p>
        </div>
        <div class="courses-grid" id="projectsGrid"></div>
    </div>

    <!-- 成就殿堂 -->
    <div id="achievementsPage" class="hidden">
        <div class="page-title">
            <h1>🏆 成就殿堂</h1>
            <p>完成课程小节，解锁成就徽章</p>
        </div>
        <div class="courses-grid" id="achievementsGrid"></div>
    </div>

    <!-- 项目详情页面 -->
    <div id="projectDetailPage" class="hidden">
        <button class="back-btn" onclick="showProjectsList()">← 返回实战项目</button>
        <div class="course-detail-header" id="projectDetailHeader"></div>
        <div class="lessons-list-container">
            <div style="flex:1;min-width:300px;background:#1A1A1A;border:1px solid #2A2A2A;border-radius:16px;padding:24px;">
                <h3 style="color:#FFFFFF;margin-bottom:20px;">📋 项目说明</h3>
                <div id="projectDescription"></div>
                <div style="margin-top:20px;padding-top:20px;border-top:1px solid #2A2A2A;">
                    <h4 style="color:#3B82F6;margin-bottom:12px;">📁 数据集</h4>
                    <div id="projectDatasetInfo"></div>
                </div>
            </div>
            <div class="lesson-detail-panel" style="display:flex;flex-direction:column;">
                <h3 style="color:#3B82F6;margin-bottom:16px;">💻 代码练习区</h3>
                <div style="text-align:center;color:#6B7280;padding:60px 20px;">
                    <p style="font-size:40px;margin-bottom:20px;">🔧</p>
                    <p style="font-size:18px;margin-bottom:10px;">编辑器开发中，敬请期待！</p>
                    <p>你可以先下载数据集，用本地的Jupyter Notebook练习。</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== 数据集 ====================
    const datasets = {
        "retail_orders.csv": "订单ID,产品名称,数量,单价,日期\nORD001,笔记本电脑,2,5999,2024-01-15\nORD002,鼠标,5,99,2024-01-16\nORD003,键盘,3,299,2024-01-16\nORD004,显示器,1,1299,2024-01-17\nORD005,鼠标垫,10,29,2024-01-18\nORD006,手机,3,1999,2024-01-18\nORD007,充电器,4,59,2024-01-19",
        "market_basket.csv": "订单号,商品\n100,牛奶\n100,面包\n101,牛奶\n101,尿布\n101,啤酒\n102,尿布\n102,啤酒\n103,牛奶\n103,面包\n103,黄油\n104,牛奶\n104,尿布\n104,啤酒",
        "customer_features.csv": "客户ID,年龄,年消费额,购物频率,平均客单价\nC001,25,3500,12,291\nC002,32,8200,25,328\nC003,45,12500,18,694\nC004,28,4800,15,320\nC005,51,8900,9,989\nC006,35,6500,20,325",
        "sales_data.csv": "月份,产品,销量,收入\n2024-01,产品A,150,15000\n2024-01,产品B,200,20000\n2024-02,产品A,180,18000\n2024-02,产品B,220,22000\n2024-03,产品A,200,20000\n2024-03,产品B,190,19000",
        "ab_test_results.csv": "用户ID,组别,转化率,停留时间(秒)\nU001,对照组,0.02,45\nU002,测试组,0.05,68\nU003,对照组,0.03,52\nU004,测试组,0.06,75\nU005,对照组,0.02,48",
        "daily_sales.csv": "日期,销售额,访客数\n2024-01-01,15800,250\n2024-01-02,16200,260\n2024-01-03,17500,280\n2024-01-04,14300,230\n2024-01-05,18900,300",
        "customer_data.csv": "客户ID,最近一次消费(天),消费频率,消费金额\nCUST001,15,20,8500\nCUST002,45,8,3200\nCUST003,5,50,25000\nCUST004,90,3,1200\nCUST005,20,35,12000",
        "reviews.csv": "评论ID,评论文本,评分\nREV001,产品质量很好,5\nREV002,发货速度有点慢,3\nREV003,性价比很高,4\nREV004,不太满意,2\nREV005,非常喜欢！,5",
        "ecommerce_sales.csv": "订单ID,商品类别,数量,单价,国家\nECO001,电子产品,1,1999,中国\nECO002,服装,2,199,美国\nECO003,家居,3,299,日本\nECO004,电子产品,1,2999,英国\nECO005,食品,5,35,中国",
        "stock_prices.csv": "日期,收盘价,成交量,最高价,最低价\n2024-01-01,150.5,1200000,152.3,148.2\n2024-01-02,152.8,1450000,155.1,150.3\n2024-01-03,151.2,980000,153.5,149.8\n2024-01-04,148.5,1600000,151.2,146.8\n2024-01-05,155.2,2100000,157.8,147.5"
    };

    // ==================== 项目数据 ====================
    const projectsData = [
        { id: 0, name: "数据清洗实战", difficulty: "入门", duration: "30分钟", desc: "掌握Pandas数据清洗核心技能", dataset: "retail_orders.csv", 
          description: "在这个项目中，你将学习如何使用Pandas清洗零售订单数据，包括处理缺失值、重复值、异常值等。",
          goals: ["学习数据清洗基本流程", "掌握缺失值处理方法", "学会处理异常值", "掌握重复值删除"] },
        { id: 1, name: "购物篮分析", difficulty: "进阶", duration: "45分钟", desc: "发现商品之间的关联关系", dataset: "market_basket.csv",
          description: "使用市场购物篮分析算法，找出商品之间的关联规则，帮助商家优化商品摆放和促销策略。",
          goals: ["理解购物篮分析概念", "学习Apriori算法原理", "掌握关联规则挖掘", "提升商业洞察力"] },
        { id: 2, name: "客户聚类分析", difficulty: "进阶", duration: "45分钟", desc: "将客户分成不同的群体", dataset: "customer_features.csv",

          goals: ["理解聚类分析原理", "学习K-Means算法", "掌握客户细分方法", "提升营销效果"] },
        { id: 3, name: "数据可视化实战", difficulty: "进阶", duration: "45分钟", desc: "使用Matplotlib和Seaborn创建专业图表", dataset: "sales_data.csv",

        { id: 4, name: "A/B测试分析", difficulty: "进阶", duration: "45分钟", desc: "学习如何进行A/B测试，评估方案效果", dataset: "ab_test_results.csv",

          description: "学习时间序列分析方法，使用历史数据预测未来销售额趋势。",
          goals: ["理解时间序列特征", "学习移动平均方法", "掌握趋势预测", "提升预测能力"] },
        { id: 6, name: "客户价值分析", difficulty: "进阶", duration: "45分钟", desc: "RFM模型分析客户价值", dataset: "customer_data.csv",
          description: "使用RFM模型（最近消费、消费频率、消费金额）分析客户价值，识别高价值客户。",
          goals: ["理解RFM模型", "学习客户分群方法", "掌握价值评估", "提升用户运营"] },
        { id: 7, name: "情感分析入门", difficulty: "高级", duration: "60分钟", desc: "使用NLP分析文本情感倾向", dataset: "reviews.csv",
          description: "入门自然语言处理，学习如何分析用户评论的情感倾向（正面、负面、中性）。",

    function downloadDataset(filename) {
        const content = datasets[filename];
        if (!content) {
            alert(`数据集 ${filename} 不存在`);
            return;
        }
        const blob = new Blob([content], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert(`✅ 开始下载 ${filename}`);
    }

    // 加载进度
    function loadProgress() {
        const saved = localStorage.getItem("courseProgress");
        if (saved) {
            const progress = JSON.parse(saved);
            courses.forEach((course, cId) => {
                if (progress[cId]) {
                    course.lessons.forEach((lesson, lId) => {
                        if (progress[cId][lId]) lesson.completed = true;
                    });
                }
            });
        }
    }

    function saveProgress() {
        const progress = {};
        courses.forEach((course, cId) => {
            progress[cId] = course.lessons.map(l => l.completed);
        });
        localStorage.setItem("courseProgress", JSON.stringify(progress));
    }

    function getCompletedCount(course) {
        return course.lessons.filter(l => l.completed).length;
    }

    // 当前课程ID
    let currentCourseId = null;
    let currentLessonId = null;

    // 运行练习代码
    window.runPracticeCode = function() {
        const textarea = document.getElementById('practiceTextarea');
        if (!textarea) {
            alert('请先打开一个小节的练习区');
            return;
        }
        const code = textarea.value;
        const outputDiv = document.getElementById('practiceOutput');
        outputDiv.innerHTML = '⏳ 运行中...\n';
        setTimeout(() => {
            try {
                const prints = [];
                const regex = /print\((.*?)\)/g;
                let match;
                while ((match = regex.exec(code)) !== null) {
                    let content = match[1].replace(/['"]/g, '');
                    prints.push(content);
                }
                if (prints.length > 0) {
                    outputDiv.innerHTML = '✅ 运行结果：\n' + prints.join('\n');
                } else {
                    outputDiv.innerHTML = '✅ 代码已执行（无print输出）\n\n提示：使用 print() 函数可以看到输出结果';
                }
            } catch(e) {
                outputDiv.innerHTML = `❌ 错误: ${e.message}`;
            }
        }, 100);
    };

    // 渲染课程列表
    function renderCoursesList() {
        const grid = document.getElementById('coursesGrid');
        grid.innerHTML = '';
        
        courses.forEach((course, cIdx) => {
            const completedCount = getCompletedCount(course);
            const totalCount = course.lessons.length;
            const percent = totalCount > 0 ? (completedCount / totalCount) * 100 : 0;
            
            const card = document.createElement('div');
            card.className = 'course-card';
            card.innerHTML = `
                <div class="course-emoji">${course.emoji}</div>
                <div class="course-title">${course.title}</div>
                <div class="course-desc">${course.desc}</div>
                <div class="course-meta">
                    <span class="difficulty ${course.difficulty}">${course.difficultyText}</span>
                    <span class="progress-text">已完成 ${completedCount}/${totalCount} 小节</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%;"></div></div>
            `;
            card.addEventListener('click', () => showCourseDetail(cIdx));
            grid.appendChild(card);
        });
    }

            lesson.tips.forEach(tip => {
                contentHtml += `
                    <div class="tip-box">${tip}</div>
                `;
            });
        }
        
        if (lesson.common_errors && lesson.common_errors.length > 0) {
            contentHtml += `
                <h4 style="color:#EF4444;margin-top:24px;margin-bottom:12px;">⚠️ 常见错误</h4>
            `;
            lesson.common_errors.forEach(err => {
                contentHtml += `
                    <div class="error-box">
                        <strong>❌ ${err.error}</strong><br>
                        <span style="color:#FCA5A5;">✅ ${err.fix}</span>
                    </div>
                `;
            });
        }
        
        if (lesson.question) {
            contentHtml += `
                <h4 style="color:#3B82F6;margin-top:24px;margin-bottom:12px;">❓ 思考题</h4>
                <p style="color:#D1D5DB;">${lesson.question}</p>
            `;
        }
        
        if (lesson.practice_code) {
            contentHtml += `
                <div class="practice-area">
                    <h5>✏️ 自己试一试</h5>
                    <textarea id="practiceTextarea" rows="8">${lesson.practice_code}</textarea>
                    <button class="run-btn" onclick="runPracticeCode()">▶ 运行代码</button>
                    <div id="practiceOutput" class="practice-output">⚡ 点击运行按钮，代码输出会显示在这里</div>
                </div>
            `;
        }
        
        contentHtml += `</div>`;
        document.getElementById('lessonDetailContent').innerHTML = contentHtml;
    }

    // 标记小节完成
    function markLessonComplete(courseId, lessonId) {
        if (courses[courseId].lessons[lessonId].completed) {
            return; // 已完成
        }
        courses[courseId].lessons[lessonId].completed = true;
        saveProgress();
        showLessonDetail(courseId, lessonId); // 刷新页面显示
    }

    // 显示课程列表
    function showCoursesList() {
        document.getElementById('courseDetailPage').classList.add('hidden');
        document.getElementById('lessonDetailPage').classList.add('hidden');
        document.getElementById('projectsPage').classList.add('hidden');
        document.getElementById('achievementsPage').classList.add('hidden');
        document.getElementById('projectDetailPage').classList.add('hidden');
        document.getElementById('coursesListPage').classList.remove('hidden');
        renderCoursesList();
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector('[data-page="courses"]').classList.add('active');
    }

    // ==================== 项目相关 ====================

    function renderProjects() {
        const grid = document.getElementById('projectsGrid');
        grid.innerHTML = '';
        projectsData.forEach((p, idx) => {
            const card = document.createElement('div');
            card.className = 'course-card';
            card.style.cursor = 'default';
            
            let difficultyClass;
            if (p.difficulty === '入门') difficultyClass = 'beginner';
            else if (p.difficulty === '进阶') difficultyClass = 'intermediate';
            else if (p.difficulty === '高级') difficultyClass = 'advanced';
            
            card.innerHTML = `
                <div class="course-emoji">💻</div>
                <div class="course-title">${p.name}</div>
                <div class="course-desc">${p.desc}</div>
                <div class="course-meta">
                    <span class="difficulty ${difficultyClass}">${p.difficulty}</span>
                    <span>${p.duration}</span>
                </div>
                <div class="dataset-card">
                    <div>📁 数据集：${p.dataset}</div>
                    <button class="download-btn" onclick="downloadDataset('${p.dataset}')">📥 下载 ${p.dataset}</button>
                </div>
                <button class="run-btn" style="margin-top:12px;width:100%;" onclick="showProjectDetail(${p.id})">▶ 开始练习</button>
            `;
            grid.appendChild(card);
        });
    }

    function showProjectDetail(projectId) {
        document.getElementById('coursesListPage').classList.add('hidden');
        document.getElementById('courseDetailPage').classList.add('hidden');
        document.getElementById('lessonDetailPage').classList.add('hidden');
        document.getElementById('projectsPage').classList.add('hidden');
        document.getElementById('achievementsPage').classList.add('hidden');
        document.getElementById('projectDetailPage').classList.remove('hidden');
        
        const project = projectsData.find(p => p.id === projectId);
        let difficultyClass;
        if (project.difficulty === '入门') difficultyClass = 'beginner';
        else if (project.difficulty === '进阶') difficultyClass = 'intermediate';
        else if (project.difficulty === '高级') difficultyClass = 'advanced';
        
        document.getElementById('projectDetailHeader').innerHTML = `
            <div class="course-icon">💻</div>
            <div class="course-info">
                <h1 style="margin:0;color:#FFFFFF;">${project.name}</h1>
                <p style="color:#9CA3AF;margin:8px 0;">${project.desc}</p>
                <div style="display:flex; gap:12px;">
                    <span class="difficulty ${difficultyClass}">${project.difficulty}</span>
                    <span style="color:#9CA3AF;">⏱ ${project.duration}</span>
                </div>
            </div>
        `;
        
        let goalsHtml = '<ul style="margin-top:16px;padding-left:20px;">';
        project.goals.forEach(goal => {
            goalsHtml += `<li style="margin:8px 0;color:#9CA3AF;">✅ ${goal}</li>`;
        });
        goalsHtml += '</ul>';
        
        document.getElementById('projectDescription').innerHTML = `
            <p style="color:#D1D5DB;line-height:1.8;">${project.description}</p>
            <div style="margin-top:24px;">
                <h4 style="color:#3B82F6;margin-bottom:12px;">🎯 学习目标</h4>
                ${goalsHtml}
            </div>
        `;
        
        document.getElementById('projectDatasetInfo').innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;background:#0A0A0A;padding:12px;border-radius:8px;border:1px solid #2A2A2A;">
                <div>
                    <div style="color:#FFFFFF;font-weight:500;">${project.dataset}</div>
                    <div style="color:#6B7280;font-size:12px;margin-top:4px;">点击右侧按钮下载</div>
                </div>
                <button class="download-btn" onclick="downloadDataset('${project.dataset}')">📥 下载</button>
            </div>
            <div style="margin-top:16px;">
                <h5 style="color:#9CA3AF;margin-bottom:8px;">📊 数据集预览：</h5>
                <pre style="background:#0A0A0A;color:#6B7280;padding:12px;border-radius:8px;font-size:12px;overflow-x:auto;max-height:150px;overflow-y:auto;">${datasets[project.dataset]}</pre>
            </div>
        `;
    }

    function showProjectsList() {
        document.getElementById('projectDetailPage').classList.add('hidden');
        document.getElementById('coursesListPage').classList.add('hidden');
        document.getElementById('courseDetailPage').classList.add('hidden');
        document.getElementById('lessonDetailPage').classList.add('hidden');
        document.getElementById('achievementsPage').classList.add('hidden');
        document.getElementById('projectsPage').classList.remove('hidden');
        renderProjects();
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector('[data-page="projects"]').classList.add('active');
    }

    // 成就殿堂
    function renderAchievements() {
        const totalCompleted = courses.reduce((sum, c) => sum + getCompletedCount(c), 0);
        const pythonCompleted = getCompletedCount(courses[0]);
        const pythonTotal = courses[0].lessons.length;
        
        const achievements = [
            { name: "🎯 入门学徒", desc: "完成3个小节", condition: totalCompleted >= 3, icon: "🎯" },
            { name: "⭐ 代码新星", desc: "完成10个小节", condition: totalCompleted >= 10, icon: "⭐" },
            { name: "🏆 学习达人", desc: "完成20个小节", condition: totalCompleted >= 20, icon: "🏆" },
            { name: "🐍 Python入门", desc: "完成Python基础入门课程", condition: pythonCompleted >= pythonTotal, icon: "🐍" }
        ];
        
        const grid = document.getElementById('achievementsGrid');
        grid.innerHTML = '';
        achievements.forEach(a => {
            const card = document.createElement('div');
            card.className = 'course-card';
            card.style.opacity = a.condition ? '1' : '0.5';
            card.style.filter = a.condition ? 'none' : 'grayscale(0.5)';
            card.style.cursor = 'default';
            card.innerHTML = `
                <div class="course-emoji">${a.icon}</div>
                <div class="course-title">${a.name}</div>
                <div class="course-desc">${a.desc}</div>
                <div class="course-meta">${a.condition ? '✅ 已解锁' : '🔒 未解锁'}</div>
            `;
            grid.appendChild(card);
        });
    }

    // 页面切换
    function switchPage(page) {
        document.getElementById('coursesListPage').classList.add('hidden');
        document.getElementById('courseDetailPage').classList.add('hidden');
        document.getElementById('lessonDetailPage').classList.add('hidden');
        document.getElementById('projectsPage').classList.add('hidden');
        document.getElementById('achievementsPage').classList.add('hidden');
        document.getElementById('projectDetailPage').classList.add('hidden');
        
        if (page === 'courses') {
            showCoursesList();
        } else if (page === 'projects') {
            showProjectsList();
        } else if (page === 'achievements') {
            document.getElementById('achievementsPage').classList.remove('hidden');
            renderAchievements();
        }
        
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-page') === page) {
                btn.classList.add('active');
            }
        });
    }

    // 绑定导航
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            switchPage(btn.getAttribute('data-page'));
        });
    });

    window.downloadDataset = downloadDataset;
    
    loadProgress();
    renderCoursesList();
    renderAchievements();
    switchPage('courses');
</script>
</body>
</html>
