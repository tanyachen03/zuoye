<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习中心 - 数据分析学院</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">📊 数据分析学院</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon text-white"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="course.html">课程</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#projects">项目</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">学习中心</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="assessment.html">综合测评</a>
                    </li>
                    <li class="nav-item">
                        <button id="login-btn" class="btn btn-outline-primary">登录</button>
                        <div id="user-menu" class="dropdown d-none">
                            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                <span id="username-span"></span>
                            </button>
                            <ul class="dropdown-menu bg-dark border border-gray-700">
                                <li><a class="dropdown-item text-gray-300" href="dashboard.html">学习中心</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-gray-300" href="#" id="logout-btn">退出登录</a></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="py-8">
        <div class="container">
            <div id="dashboard-content">
                <!-- 统计卡片 -->
                <div class="row g-4 mb-8">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon">📚</div>
                            <div class="stat-value" id="stat-courses">0/5</div>
                            <div class="stat-label">课程完成</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon">🎯</div>
                            <div class="stat-value" id="stat-projects">0/10</div>
                            <div class="stat-label">项目完成</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon">🏆</div>
                            <div class="stat-value" id="stat-badges">0/6</div>
                            <div class="stat-label">成就徽章</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon">🔥</div>
                            <div class="stat-value" id="stat-streak">1</div>
                            <div class="stat-label">连续学习天数</div>
                        </div>
                    </div>
                </div>

                <!-- 进度条 -->
                <div class="row g-4 mb-8">
                    <div class="col-md-6">
                        <div class="progress-bar-container">
                            <div class="progress-text">
                                <span>课程进度</span>
                                <span id="course-progress-text">0%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-bar-fill" id="course-progress-fill"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="progress-bar-container">
                            <div class="progress-text">
                                <span>项目进度</span>
                                <span id="project-progress-text">0%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-bar-fill" id="project-progress-fill"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 成就徽章 -->
                <div class="card mb-8">
                    <div class="card-header">
                        <h3><i class="bi bi-award"></i> 成就徽章</h3>
                    </div>
                    <div class="card-body">
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4" id="badges-container">
                        </div>
                    </div>
                </div>

                <!-- 学习记录 -->
                <div class="card">
                    <div class="card-header">
                        <h3><i class="bi bi-clock-history"></i> 最近学习</h3>
                    </div>
                    <div class="card-body">
                        <ul class="list-group" id="recent-activity">
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="text-center mt-6 text-secondary small">
                <p>© 2024 数据分析学院. 保留所有权利.</p>
            </div>
        </div>
    </footer>

    <!-- 登录模态框 -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">登录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" id="login-username" placeholder="请输入用户名">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-control" id="login-password" placeholder="请输入密码">
                        </div>
                        <button type="button" class="btn btn-primary w-100" onclick="login()">登录</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initPage('dashboard');
        });
    </script>
</body>
</html>
