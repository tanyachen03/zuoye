<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目实战 - 数据分析学院</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">📊 数据分析学院</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon text-white"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="course.html">课程</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html#projects">项目</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">学习中心</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="assessment.html">综合测评</a>
                    </li>
                    <li class="nav-item">
                        <button id="login-btn" class="btn btn-outline-primary">登录</button>
                        <div id="user-menu" class="dropdown d-none">
                            <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                <span id="username-span"></span>
                            </button>
                            <ul class="dropdown-menu bg-dark border border-gray-700">
                                <li><a class="dropdown-item text-gray-300" href="dashboard.html">学习中心</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item text-gray-300" href="#" id="logout-btn">退出登录</a></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 项目内容 -->
    <main class="py-8">
        <div class="container">
            <div id="project-content">
                <div class="row">
                    <div class="col-lg-8">
                        <!-- 项目标题 -->
                        <div class="card">
                            <div class="card-body">
                                <nav aria-label="breadcrumb">
                                    <ol class="breadcrumb bg-transparent">
                                        <li class="breadcrumb-item"><a href="index.html">首页</a></li>
                                        <li class="breadcrumb-item"><a href="index.html#projects">实战项目</a></li>
                                        <li class="breadcrumb-item active" aria-current="page" id="project-title"></li>
                                    </ol>
                                </nav>
                                <h1 id="project-title-h1"></h1>
                                <p id="project-desc" class="text-secondary mt-3"></p>
                                <div class="d-flex gap-4 mt-4">
                                    <span class="level-badge beginner" id="project-level"></span>
                                    <span class="text-secondary"><i class="bi bi-clock"></i> <span id="project-duration"></span></span>
                                </div>
                            </div>
                        </div>

                        <!-- 项目背景 -->
                        <div class="card mt-4">
                            <div class="card-header">
                                <h3><i class="bi bi-info-circle"></i> 项目背景</h3>
                            </div>
                            <div class="card-body">
                                <p id="project-background" class="text-secondary"></p>
                            </div>
                        </div>

                        <!-- 学习目标 -->
                        <div class="card mt-4">
                            <div class="card-header">
                                <h3><i class="bi bi-target"></i> 学习目标</h3>
                            </div>
                            <div class="card-body">
                                <ul class="goals-list" id="project-goals"></ul>
                            </div>
                        </div>

                        <!-- 小贴士 -->
                        <div class="card mt-4">
                            <div class="card-header">
                                <h3><i class="bi bi-lightbulb"></i> 小贴士</h3>
                            </div>
                            <div class="card-body">
                                <ul class="tips-list" id="tips-list"></ul>
                            </div>
                        </div>

                        <!-- 代码编辑器 -->
                        <div class="card mt-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h3><i class="bi bi-code-slash"></i> 代码实战</h3>
                                <div class="btn-group" role="group">
                                    <button id="load-dataset-btn" class="btn btn-primary btn-sm" style="display: none;">
                                        <i class="bi bi-download"></i> 加载数据集
                                    </button>
                                    <button id="download-dataset-btn" class="btn btn-outline-primary btn-sm" style="display: none;">
                                        <i class="bi bi-save"></i> 下载数据集
                                    </button>
                                </div>
                            </div>
                            <div class="card-body p-0">
                                <div class="code-editor-container" id="code-editor-container">
                                    <div class="code-editor-header">
                                        <div>
                                            <h3><i class="bi bi-code-slash me-2"></i>Python 代码编辑器</h3>
                                            <small class="opacity-75" id="py-status-text">⏳ 正在初始化 Python 环境...</small>
                                        </div>
                                        <div class="editor-buttons">
                                            <span class="status-badge" id="py-status">⏳ 加载中</span>
                                            <button class="btn-editor clear" onclick="clearCode()">
                                                <i class="bi bi-eraser-fill"></i> 清除
                                            </button>
                                            <button class="btn-editor run" onclick="runCode()">
                                                <i class="bi bi-play-fill"></i> 运行代码
                                            </button>
                                        </div>
                                    </div>
                                    <div class="code-editor-body">
                                        <textarea class="code-input" id="main-code-input" spellcheck="false"></textarea>
                                    </div>
                                    <div class="output-header">
                                        <span><i class="bi bi-terminal-fill me-2"></i>输出结果</span>
                                        <button class="btn-editor clear-output" onclick="clearOutput()">
                                            <i class="bi bi-x-lg"></i> 清除输出
                                        </button>
                                    </div>
                                    <pre class="code-output" id="main-code-output">等待代码执行...</pre>
                                </div>
                            </div>
                        </div>

                        <!-- 常见错误 -->
                        <div class="card mt-4">
                            <div class="card-header">
                                <h3><i class="bi bi-exclamation-triangle"></i> 常见错误与解决方案</h3>
                            </div>
                            <div class="card-body">
                                <ul class="errors-list" id="errors-list"></ul>
                            </div>
                        </div>

                        <!-- 完成按钮 -->
                        <div class="mt-4 text-center">
                            <button id="complete-project" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> 标记为已完成
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="text-center mt-6 text-secondary small">
                <p>© 2024 数据分析学院. 保留所有权利.</p>
            </div>
        </div>
    </footer>

    <!-- 登录模态框 -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">登录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" id="login-username" placeholder="请输入用户名">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-control" id="login-password" placeholder="请输入密码">
                        </div>
                        <button type="button" class="btn btn-primary w-100" onclick="login()">登录</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initPage('project');
        });
    </script>
</body>
</html>
