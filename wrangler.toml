# Cloudflare Pages 配置
# 用于在 Cloudflare Pages 上部署 Python Flask 应用

name = "zuoye"
compatibility_date = "2024-01-01"

# Build 配置
[builds]
command = "pip install -r requirements.txt"
directory = "/"

# 环境变量（如果需要）
[vars]
PYTHON_VERSION = "3.11"

# Pages Functions 配置（如果有serverless函数）
# [[pages.functions]]
# directory = "./functions"
# runtime = "python"
