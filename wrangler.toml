# ============================================
# Cloudflare Pages 配置文件
# ============================================
# 
# 这个配置适用于纯静态网站部署到 Cloudflare Pages
# 无需 Workers 或 D1 数据库（使用前端模拟数据）
#
# 部署方式：
# 1. 登录 Cloudflare Dashboard
# 2. 进入 Pages > Create a project
# 3. 连接 GitHub 仓库
# 4. 设置：
#    - Build command: （留空）
#    - Output directory: public
# 5. 点击 Deploy site
# ============================================

name = "zuoye"
compatibility_date = "2024-01-01"

# ============================================
# Pages 配置
# ============================================
[pages]
# 静态文件目录
bucket = "./public"

# ============================================
# 环境变量（可选）
# ============================================
[env.production]
name = "zuoye"

# ============================================
# 构建配置
# ============================================
[build]
command = ""
directory = "./public"

[build.environment]
NODE_VERSION = "18"

# ============================================
# 路由规则（可选）
# ============================================
# [[routes]]
# pattern = "example.com/*"
# zone_name = "example.com"
# ============================================
