<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数析学院 - 完整学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0D1117;
            color: #E6EDF3;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            background: #161B22;
            border-radius: 12px;
            margin-bottom: 32px;
            border: 1px solid #30363D;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #58A6FF;
        }
        .nav-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .nav-links span {
            color: #E6EDF3;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-links span:hover {
            background: #30363D;
        }
        .nav-links span.active {
            background: #238636;
            color: white;
        }
        .login-btn {
            background: #238636;
            padding: 8px 24px;
            border-radius: 8px;
            cursor: pointer;
        }
        .page-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .page-title {
            text-align: center;
            margin-bottom: 32px;
        }
        .page-title h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .page-title p {
            color: #8B949E;
        }
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }
        .course-card {
            background: #161B22;
            border: 1px solid #30363D;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .course-card:hover {
            transform: translateY(-2px);
            border-color: #58A6FF;
        }
        .course-emoji {
            font-size: 36px;
            margin-bottom: 12px;
        }
        .course-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .course-desc {
            color: #8B949E;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .course-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .difficulty {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .difficulty.beginner { background: #238636; }
        .difficulty.intermediate { background: #D29922; }
        .difficulty.advanced { background: #DA3633; }
        .progress-text {
            color: #58A6FF;
            font-size: 13px;
        }
        .progress-bar {
            height: 6px;
            background: #30363D;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #238636;
            width: 0%;
            transition: width 0.3s;
        }
        .lessons-container {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #30363D;
            display: none;
        }
        .lessons-container.open {
            display: block;
        }
        .lesson-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            background: #0D1117;
            border-radius: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .lesson-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
            min-width: 150px;
        }
        .lesson-name {
            flex: 1;
        }
        .lesson-duration {
            color: #8B949E;
            font-size: 12px;
        }
        .complete-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .complete-btn.done {
            background: #30363D;
            color: #8B949E;
            cursor: default;
        }
        .detail-panel {
            margin-top: 20px;
            padding: 20px;
            background: #161B22;
            border: 1px solid #30363D;
            border-radius: 12px;
            display: none;
        }
        .detail-panel.show {
            display: block;
        }
        .detail-panel h4 {
            margin-bottom: 12px;
            color: #58A6FF;
        }
        .detail-panel pre {
            background: #0D1117;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .tip-box {
            background: #1a2a1a;
            border-left: 4px solid #238636;
            padding: 10px;
            margin: 12px 0;
            border-radius: 6px;
        }
        .practice-area {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #30363D;
        }
        .practice-area h5 {
            color: #58A6FF;
            margin-bottom: 12px;
        }
        .practice-area textarea {
            width: 100%;
            background: #0D1117;
            color: #E6EDF3;
            font-family: 'Courier New', monospace;
            padding: 12px;
            border: 1px solid #30363D;
            border-radius: 8px;
            font-size: 13px;
            resize: vertical;
        }
        .run-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
        }
        .run-btn:hover {
            background: #2EA043;
        }
        .practice-output {
            background: #0D1117;
            border: 1px solid #30363D;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        .dataset-card {
            background: #0D1117;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
        }
        .download-btn {
            background: #58A6FF;
            color: #0D1117;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
            display: inline-block;
            text-decoration: none;
        }
        .download-btn:hover {
            background: #79c0ff;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 700px) {
            .courses-grid { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; gap: 16px; }
            .nav-links { justify-content: center; }
            .lesson-item { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">📊 数析学院</div>
    <div class="nav-links">
        <span class="active" data-page="courses">课程中心</span>
        <span data-page="projects">实战项目</span>
        <span data-page="achievements">成就殿堂</span>
    </div>
    <div class="login-btn">登录</div>
</div>

<div class="page-container" id="app">
    <div id="coursesPage">
        <div class="page-title">
            <h1>📚 课程中心</h1>
            <p>选择你感兴趣的课程，点击卡片展开小节列表</p>
        </div>
        <div class="courses-grid" id="coursesGrid"></div>
        <div id="detailPanel" class="detail-panel"></div>
    </div>

    <div id="projectsPage" class="hidden">
        <div class="page-title">
            <h1>💻 实战项目</h1>
            <p>点击项目开始练习，数据集可下载</p>
        </div>
        <div class="courses-grid" id="projectsGrid"></div>
    </div>

    <div id="achievementsPage" class="hidden">
        <div class="page-title">
            <h1>🏆 成就殿堂</h1>
            <p>完成课程小节，解锁成就徽章</p>
        </div>
        <div class="courses-grid" id="achievementsGrid"></div>
    </div>
</div>

<script>
    // ==================== 数据集（CSV内容） ====================
    const datasets = {
        "retail_orders.csv": "订单ID,产品名称,数量,单价,日期\nORD001,笔记本电脑,2,5999,2024-01-15\nORD002,鼠标,5,99,2024-01-16\nORD003,键盘,3,299,2024-01-16\nORD004,显示器,1,1299,2024-01-17\nORD005,鼠标垫,10,29,2024-01-18",
        "market_basket.csv": "订单号,商品\n100,牛奶\n100,面包\n101,牛奶\n101,尿布\n101,啤酒\n102,尿布\n102,啤酒\n103,牛奶\n103,面包\n103,黄油",
        "customer_features.csv": "客户ID,年龄,年消费额,购物频率,平均客单价\nC001,25,3500,12,291\nC002,32,8200,25,328\nC003,45,12500,18,694\nC004,28,4800,15,320\nC005,51,8900,9,989"
    };

    // 下载数据集
    function downloadDataset(filename) {
        const content = datasets[filename];
        if (!content) {
            alert(`数据集 ${filename} 不存在`);
            return;
        }
        const blob = new Blob([content], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert(`开始下载 ${filename}`);
    }

    // ==================== 课程数据 ====================
    const courses = [
        {
            id: 0, emoji: "🐍", title: "Python基础入门", desc: "从零开始掌握Python编程基础",
            difficulty: "beginner", difficultyText: "入门",
            lessons: [
                { name: "Python安装与环境配置", duration: "15分钟", completed: false, content: "Python是一种解释型、面向对象的编程语言，语法简洁，适合初学者。安装Python时，请访问python.org下载最新版本，安装时务必勾选'Add Python to PATH'。", code: "print('Hello, World!')\n\n# 验证安装\nimport sys\nprint(f'Python版本: {sys.version}')", tip: "安装时记得勾选'Add Python to PATH'，否则命令行无法直接使用python命令", question: "你安装的Python版本是多少？在终端输入 python --version 查看", practice_code: "# 试试输出你自己的欢迎语\nprint('欢迎来到Python世界！')\n\n# 可以修改上面的文字试试" },
                { name: "变量与数据类型", duration: "20分钟", completed: false, content: "变量是存储数据的容器。Python有int（整数）、float（浮点数）、str（字符串）、bool（布尔值）等基本数据类型。Python是动态类型语言，不需要声明变量类型。", code: "x = 10          # 整数\nname = 'Python'  # 字符串\npi = 3.14        # 浮点数\nis_ok = True     # 布尔值\n\nprint(f'{name}的版本是{x}')", tip: "变量名要见名知意，使用下划线分隔多个单词，如 user_name", question: "创建一个变量存储你的年龄，并打印出来", practice_code: "# 创建变量\nmy_age = 18\nmy_name = '小明'\n\n# 打印变量\nprint(f'我叫{my_name}，今年{my_age}岁')\n\n# 试试创建你自己的变量" },
                { name: "条件判断if-else", duration: "20分钟", completed: false, content: "条件判断让程序可以根据不同情况执行不同代码。if语句后面跟条件，条件为True时执行缩进的代码块。elif是else if的缩写，可以有多个。else在所有条件都不满足时执行。", code: "age = 18\nif age >= 18:\n    print('成年')\n    print('可以考驾照了')\nelif age >= 6:\n    print('学龄儿童')\nelse:\n    print('幼儿')", tip: "注意缩进！Python用缩进表示代码块，必须保持一致（通常用4个空格）", question: "写一个判断成绩是否及格的程序，60分及以上为及格", practice_code: "# 写一个成绩判断程序\nscore = 75\n\nif score >= 60:\n    print('及格了！')\nelse:\n    print('不及格，继续努力')\n\n# 试试修改score的值" },
                { name: "循环语句for/while", duration: "25分钟", completed: false, content: "循环让代码重复执行。for循环用于遍历序列（列表、字符串、range等）。while循环在条件满足时重复执行。range()可以生成数字序列，break用于提前退出循环。", code: "# for循环遍历\nfor i in range(5):\n    print(f'第{i}次循环')\n\n# while循环\ncount = 0\nwhile count < 3:\n    print(f'while循环: {count}')\n    count += 1", tip: "range(5)生成0,1,2,3,4；range(1,5)生成1,2,3,4；range(1,10,2)生成1,3,5,7,9", question: "用for循环打印1到10的所有数字", practice_code: "# 打印1到10\nfor i in range(1, 11):\n    print(i)\n\n# 试试改成打印1到20" },
                { name: "列表与元组", duration: "20分钟", completed: false, content: "列表是可变的序列，用[]表示，可以增删改查。元组是不可变的序列，用()表示，一旦创建不能修改。列表常用方法：append、insert、remove、pop等。", code: "fruits = ['苹果', '香蕉', '橙子']\nfruits.append('葡萄')\nfruits[0] = '苹果2号'\nprint(fruits)\n\n# 元组不可变\ndays = ('一', '二', '三', '四', '五')\nprint(days[0])", tip: "列表用方括号[]，元组用圆括号()。列表适合需要修改的数据，元组适合不需要修改的数据", question: "创建一个包含3个数字的列表，然后添加第4个数字", practice_code: "# 创建列表\nnumbers = [10, 20, 30]\nprint('原列表:', numbers)\n\n# 添加元素\nnumbers.append(40)\nprint('添加后:', numbers)\n\n# 试试创建你自己的列表" },
                { name: "字典与集合", duration: "20分钟", completed: false, content: "字典存储键值对（key-value），用{}表示，通过键快速访问值。键必须是不可变类型（字符串、数字、元组）。集合存储不重复的元素，也用{}表示但只有值没有键。", code: "person = {\n    'name': '张三',\n    'age': 20,\n    'city': '北京'\n}\nprint(person['name'])\nperson['age'] = 21\nprint(person)\n\n# 集合\nunique_nums = {1, 2, 3, 2, 1}\nprint(unique_nums)", tip: "字典键必须是不可变的，可以是字符串、数字或元组。列表不能作为字典键", question: "创建一个表示你信息的字典（姓名、年龄、城市）", practice_code: "# 创建字典\nmy_info = {\n    'name': '李华',\n    'age': 20,\n    'hobby': '编程'\n}\nprint(my_info)\n\n# 试试添加新的键值对" },
                { name: "函数定义与调用", duration: "25分钟", completed: false, content: "函数是组织好的、可重复使用的代码块，用def关键字定义。函数可以接收参数，用return返回结果。函数让代码更模块化、可复用。", code: "def greet(name):\n    return f'你好，{name}！'\n\nresult = greet('小明')\nprint(result)\n\ndef add(a, b):\n    return a + b\n\nprint(add(3, 5))", tip: "函数名要动词开头，如get_name、calculate_total。参数可以有默认值", question: "写一个计算两个数之和的函数，并调用它", practice_code: "# 定义求和函数\ndef sum_two_numbers(a, b):\n    return a + b\n\n# 调用函数\nresult = sum_two_numbers(10, 20)\nprint(f'10+20={result}')\n\n# 试试修改函数" },
                { name: "模块与包导入", duration: "15分钟", completed: false, content: "模块是包含Python代码的.py文件。用import语句导入模块，然后使用模块中的函数、类、变量。Python标准库提供了大量内置模块，如math、random、datetime等。", code: "import math\nimport random\n\nprint(f'圆周率: {math.pi}')\nprint(f'平方根: {math.sqrt(16)}')\nprint(f'随机数: {random.randint(1, 10)}')\n\n# 可以用as起别名\nimport datetime as dt\nprint(dt.datetime.now())", tip: "可以用from...import导入特定函数，如 from math import sqrt。避免导入过多不必要的函数", question: "导入random模块，生成1到100之间的随机整数", practice_code: "import random\n\n# 生成1-100随机数\nnum = random.randint(1, 100)\nprint(f'随机数: {num}')\n\n# 试试多次运行看不同结果" }
            ]
        },
        {
            id: 1, emoji: "📊", title: "Pandas入门", desc: "数据分析的核心工具Pandas",
            difficulty: "beginner", difficultyText: "入门",
            lessons: [
                { name: "Pandas安装与Series", duration: "15分钟", completed: false, content: "Pandas是Python数据分析的核心库。安装命令：pip install pandas。Series是一维带标签的数组。", code: "import pandas as pd\ns = pd.Series([1, 2, 3, 4], index=['a','b','c','d'])\nprint(s)", tip: "安装Pandas前建议先安装NumPy", question: "创建一个值为[5,10,15]的Series", practice_code: "import pandas as pd\ns = pd.Series([1,2,3])\nprint(s)" },
                { name: "DataFrame创建与查看", duration: "20分钟", completed: false, content: "DataFrame是二维表格数据结构，类似Excel表格。可以从字典、列表、CSV文件创建。", code: "df = pd.DataFrame({\n    '姓名': ['张三','李四'],\n    '年龄': [20,25]\n})\nprint(df.head())", tip: "使用df.info()查看数据信息", question: "创建一个包含姓名和成绩的DataFrame", practice_code: "import pandas as pd\ndf = pd.DataFrame({'A':[1,2],'B':[3,4]})\nprint(df)" }
            ]
        },
        {
            id: 2, emoji: "🧹", title: "数据清洗", desc: "脏数据到干净数据的转化",
            difficulty: "intermediate", difficultyText: "进阶",
            lessons: [
                { name: "缺失值识别", duration: "15分钟", completed: false, content: "数据清洗第一步是识别缺失值。用isnull()和info()查看缺失情况。", code: "df.isnull().sum()", tip: "缺失值通常用NaN表示", question: "如何查看DataFrame中每列的缺失值数量？", practice_code: "# 识别缺失值示例\nimport pandas as pd\ndf = pd.DataFrame({'A':[1,None,3]})\nprint(df.isnull())" }
            ]
        }
    ];

    function loadProgress() {
        const saved = localStorage.getItem("courseProgress");
        if (saved) {
            const progress = JSON.parse(saved);
            courses.forEach((course, cId) => {
                if (progress[cId]) {
                    course.lessons.forEach((lesson, lId) => {
                        if (progress[cId][lId]) lesson.completed = true;
                    });
                }
            });
        }
    }

    function saveProgress() {
        const progress = {};
        courses.forEach((course, cId) => {
            progress[cId] = course.lessons.map(l => l.completed);
        });
        localStorage.setItem("courseProgress", JSON.stringify(progress));
    }

    function getCompletedCount(course) {
        return course.lessons.filter(l => l.completed).length;
    }

    let openCourseId = null;

    function runPracticeCode(lesson) {
        const textarea = document.getElementById('practiceTextarea');
        if (!textarea) return;
        const code = textarea.value;
        const outputDiv = document.getElementById('practiceOutput');
        outputDiv.innerHTML = '⏳ 模拟运行中...\n';
        setTimeout(() => {
            try {
                const prints = [];
                const regex = /print\((.*?)\)/g;
                let match;
                while ((match = regex.exec(code)) !== null) {
                    let content = match[1].replace(/['"]/g, '');
                    prints.push(content);
                }
                if (prints.length > 0) {
                    outputDiv.innerHTML = '✅ 运行结果：\n' + prints.join('\n');
                } else {
                    outputDiv.innerHTML = '✅ 代码已执行（无print输出）\n\n提示：使用print()函数可以看到输出结果';
                }
            } catch(e) {
                outputDiv.innerHTML = `❌ 错误: ${e.message}`;
            }
        }, 100);
    }

    function renderCourses() {
        const grid = document.getElementById("coursesGrid");
        grid.innerHTML = "";
        courses.forEach((course, idx) => {
            const completed = getCompletedCount(course);
            const total = course.lessons.length;
            const percent = (completed / total) * 100;
            const card = document.createElement("div");
            card.className = "course-card";
            card.innerHTML = `
                <div class="course-emoji">${course.emoji}</div>
                <div class="course-title">${course.title}</div>
                <div class="course-desc">${course.desc}</div>
                <div class="course-meta">
                    <span class="difficulty ${course.difficulty}">${course.difficultyText}</span>
                    <span class="progress-text">已完成 ${completed}/${total} 小节</span>
                </div>
                <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%;"></div></div>
                <div class="lessons-container" data-course="${idx}">
                    ${renderLessons(course, idx)}
                </div>
            `;
            grid.appendChild(card);
        });

        document.querySelectorAll(".course-card").forEach((card, i) => {
            const lessonsDiv = card.querySelector(".lessons-container");
            card.addEventListener("click", (e) => {
                if (e.target.classList.contains("complete-btn") || e.target.classList.contains("lesson-info")) return;
                if (openCourseId === i) {
                    lessonsDiv.classList.remove("open");
                    openCourseId = null;
                } else {
                    document.querySelectorAll(".lessons-container").forEach(el => el.classList.remove("open"));
                    lessonsDiv.classList.add("open");
                    openCourseId = i;
                }
            });
        });

        document.querySelectorAll(".complete-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const courseId = parseInt(btn.dataset.course);
                const lessonId = parseInt(btn.dataset.lesson);
                if (!courses[courseId].lessons[lessonId].completed) {
                    courses[courseId].lessons[lessonId].completed = true;
                    saveProgress();
                    renderCourses();
                    renderAchievements();
                }
            });
        });

        document.querySelectorAll(".lesson-info").forEach(el => {
            el.addEventListener("click", (e) => {
                e.stopPropagation();
                const courseId = parseInt(el.dataset.course);
                const lessonId = parseInt(el.dataset.lesson);
                const lesson = courses[courseId].lessons[lessonId];
                const panel = document.getElementById("detailPanel");
                panel.innerHTML = `
                    <h4>📖 ${lesson.name}</h4>
                    <p>${lesson.content}</p>
                    <pre><code>${lesson.code}</code></pre>
                    <div class="tip-box">💡 小贴士：${lesson.tip}</div>
                    <p>❓ 思考题：${lesson.question}</p>
                    <div class="practice-area">
                        <h5>✏️ 自己试一试</h5>
                        <textarea id="practiceTextarea" rows="6" placeholder="在这里修改代码...">${lesson.practice_code || lesson.code}</textarea>
                        <button class="run-btn" onclick="runPracticeCode()">▶ 运行代码</button>
                        <div id="practiceOutput" class="practice-output">⚡ 点击运行按钮，代码输出会显示在这里</div>
                    </div>
                `;
                panel.classList.add("show");
                window.currentLesson = lesson;
            });
        });
    }

    function renderLessons(course, courseId) {
        let html = '<div>';
        course.lessons.forEach((lesson, lIdx) => {
            const doneClass = lesson.completed ? 'done' : '';
            const btnText = lesson.completed ? '✓ 已完成' : '✓ 标记完成';
            html += `
                <div class="lesson-item">
                    <div class="lesson-info" data-course="${courseId}" data-lesson="${lIdx}">
                        <span class="lesson-name">${lesson.name}</span>
                        <span class="lesson-duration">${lesson.duration}</span>
                    </div>
                    <button class="complete-btn ${doneClass}" data-course="${courseId}" data-lesson="${lIdx}" ${lesson.completed ? 'disabled' : ''}>${btnText}</button>
                </div>
            `;
        });
        html += '</div>';
        return html;
    }

    function renderProjects() {
        const grid = document.getElementById("projectsGrid");
        grid.innerHTML = "";
        const projectsList = [
            { name: "数据清洗实战", difficulty: "入门", duration: "30分钟", desc: "掌握Pandas数据清洗核心技能", dataset: "retail_orders.csv" },
            { name: "购物篮分析", difficulty: "进阶", duration: "45分钟", desc: "发现商品之间的关联关系", dataset: "market_basket.csv" },
            { name: "客户聚类分析", difficulty: "进阶", duration: "45分钟", desc: "使用聚类分析将客户分成不同的群体", dataset: "customer_features.csv" },
            { name: "数据可视化", difficulty: "进阶", duration: "45分钟", desc: "学习使用Matplotlib进行数据可视化", dataset: "retail_orders.csv" }
        ];
        projectsList.forEach(p => {
            const card = document.createElement("div");
            card.className = "course-card";
            card.style.cursor = "default";
            card.innerHTML = `
                <div class="course-emoji">💻</div>
                <div class="course-title">${p.name}</div>
                <div class="course-desc">${p.desc}</div>
                <div class="course-meta">
                    <span class="difficulty ${p.difficulty === '入门' ? 'beginner' : 'intermediate'}">${p.difficulty}</span>
                    <span>${p.duration}</span>
                </div>
                <div class="dataset-card">
                    <div>📁 数据集：${p.dataset}</div>
                    <button class="download-btn" onclick="downloadDataset('${p.dataset}')">📥 下载 ${p.dataset}</button>
                </div>
                <button class="run-btn" style="margin-top:12px; width:100%" onclick="alert('编辑器开发中，敬请期待！\n\n你可以先下载数据集，用本地的Jupyter Notebook练习。')">▶ 开始练习</button>
            `;
            grid.appendChild(card);
        });
    }

    function renderAchievements() {
        const totalCompleted = courses.reduce((sum, c) => sum + getCompletedCount(c), 0);
        const achievements = [
            { name: "🎯 入门学徒", desc: "完成3个小节", condition: totalCompleted >= 3, icon: "🎯" },
            { name: "⭐ 代码新星", desc: "完成10个小节", condition: totalCompleted >= 10, icon: "⭐" },
            { name: "🏆 学习达人", desc: "完成20个小节", condition: totalCompleted >= 20, icon: "🏆" },
            { name: "🐍 Python入门", desc: "完成Python基础入门课程", condition: getCompletedCount(courses[0]) >= courses[0].lessons.length, icon: "🐍" }
        ];
        const grid = document.getElementById("achievementsGrid");
        grid.innerHTML = "";
        achievements.forEach(a => {
            grid.innerHTML += `
                <div class="course-card" style="opacity: ${a.condition ? 1 : 0.5}; filter: ${a.condition ? 'none' : 'grayscale(0.5)'}; cursor:default">
                    <div class="course-emoji">${a.icon}</div>
                    <div class="course-title">${a.name}</div>
                    <div class="course-desc">${a.desc}</div>
                    <div class="course-meta">${a.condition ? '✅ 已解锁' : '🔒 未解锁'}</div>
                </div>
            `;
        });
    }

    function switchPage(page) {
        document.getElementById("coursesPage").classList.add("hidden");
        document.getElementById("projectsPage").classList.add("hidden");
        document.getElementById("achievementsPage").classList.add("hidden");
        if (page === "courses") document.getElementById("coursesPage").classList.remove("hidden");
        if (page === "projects") document.getElementById("projectsPage").classList.remove("hidden");
        if (page === "achievements") document.getElementById("achievementsPage").classList.remove("hidden");
        
        document.querySelectorAll(".nav-links span").forEach(link => {
            link.classList.remove("active");
            if (link.dataset.page === page) link.classList.add("active");
        });
        
        if (page === "projects") renderProjects();
        if (page === "achievements") renderAchievements();
    }

    document.querySelectorAll(".nav-links span").forEach(link => {
        link.addEventListener("click", () => switchPage(link.dataset.page));
    });

    window.runPracticeCode = function() {
        const textarea = document.getElementById('practiceTextarea');
        if (!textarea) {
            alert('请先点击一个小节，打开练习区');
            return;
        }
        const code = textarea.value;
        const outputDiv = document.getElementById('practiceOutput');
        outputDiv.innerHTML = '⏳ 运行中...\n';
        setTimeout(() => {
            try {
                const prints = [];
                const regex = /print\((.*?)\)/g;
                let match;
                while ((match = regex.exec(code)) !== null) {
                    let content = match[1].replace(/['"]/g, '');
                    prints.push(content);
                }
                if (prints.length > 0) {
                    outputDiv.innerHTML = '✅ 运行结果：\n' + prints.join('\n');
                } else {
                    outputDiv.innerHTML = '✅ 代码已执行（无print输出）\n\n提示：使用print()函数可以看到输出结果\n\n代码已保存，你可以继续修改重试。';
                }
            } catch(e) {
                outputDiv.innerHTML = `❌ 错误: ${e.message}`;
            }
        }, 100);
    };

    window.downloadDataset = downloadDataset;
    loadProgress();
    renderCourses();
    renderAchievements();
    switchPage("courses");
</script>
</body>
</html>
