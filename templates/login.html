{% extends "base.html" %}
{% block title %}登录 · BizData{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="card border-0 shadow p-4">
            <h3 class="mb-3 text-center"><i class="bi bi-box-arrow-in-right text-primary"></i> 账号登录</h3>
            <form method="post">
                <div class="mb-3"><label class="form-label">用户名或邮箱</label><input class="form-control form-control-lg" name="username" required></div>
                <div class="mb-3"><label class="form-label">密码</label><input class="form-control form-control-lg" type="password" name="password" required></div>
                <button class="btn btn-primary w-100 btn-lg" type="submit">登录</button>
            </form>
            <div class="text-center mt-3 small text-muted">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></div>
        </div>
    </div>
</div>
{% endblock %}
