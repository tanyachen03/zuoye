{% extends "base.html" %}
{% block title %}注册 · BizData{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="card border-0 shadow p-4">
            <h3 class="mb-3 text-center"><i class="bi bi-person-plus text-primary"></i> 创建账号</h3>
            <form method="post">
                <div class="mb-3"><label class="form-label">用户名</label><input class="form-control form-control-lg" name="username" minlength="3" required></div>
                <div class="mb-3"><label class="form-label">邮箱</label><input class="form-control form-control-lg" type="email" name="email" required></div>
                <div class="mb-3"><label class="form-label">密码（≥6位）</label><input class="form-control form-control-lg" type="password" name="password" minlength="6" required></div>
                <div class="mb-3"><label class="form-label">再次输入密码</label><input class="form-control form-control-lg" type="password" name="password2" minlength="6" required></div>
                <button class="btn btn-primary w-100 btn-lg" type="submit">立即注册</button>
            </form>
            <div class="text-center mt-3 small text-muted">已有账号？<a href="{{ url_for('login') }}">去登录</a></div>
        </div>
    </div>
</div>
{% endblock %}
