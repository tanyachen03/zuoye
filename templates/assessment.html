{% extends "base.html" %}
{% block title %}综合测评 · BizData{% endblock %}
{% block content %}
<section class="mb-4 rounded-4 p-5 text-white" style="background:linear-gradient(135deg,#dc2626 0%,#ea580c 100%);">
    <h1><i class="bi bi-patch-check"></i> 综合测评</h1>
    <p class="mb-0 opacity-90">20 道选择题 · 涵盖所有课程 · 60 分及格 · 满分可获得“完美学霸”徽章</p>
</section>

<div class="card border-0 shadow p-4">
    <form method="post">
        {% for q in questions %}
        <div class="mb-4 pb-3 border-bottom">
            <h6 class="fw-bold mb-3">Q{{ loop.index }}. {{ q.q }}</h6>
            {% for opt in q.options %}
            <label class="quiz-opt d-block">
                <input type="radio" name="q{{ loop.index0 }}" value="{{ loop.index0 }}" class="me-2" required>{{ opt }}
            </label>
            {% endfor %}
        </div>
        {% endfor %}
        <button class="btn btn-primary btn-lg w-100" type="submit"><i class="bi bi-send"></i> 提交试卷</button>
    </form>
</div>
{% endblock %}
